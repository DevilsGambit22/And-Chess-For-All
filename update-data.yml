name: Update Chess.com Club Data

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Update data
        env:
          CLUB_SLUG: and-chess-for-all-1
          CHESS_API_CONTACT: DevilsGambit22 And Chess For All website
        run: node scripts/update-data.js
      - name: Commit updated data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Update club data
          file_pattern: data/club-data.json
